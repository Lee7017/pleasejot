name: Visual review PleaseJot website

on:
  push:
    branches: [main]
    paths:
      - 'docs/.vitepress/theme/**'
      - 'docs/.vitepress/config.ts'
      - 'docs/**/*.md'
      - 'scripts/all-pages-regression.mjs'
      - 'scripts/visual-review.mjs'
      - 'scripts/layout-regression.mjs'
      - 'scripts/feedback-regression.mjs'
      - 'scripts/motion-regression.mjs'
      - 'scripts/complex-motion-regression.mjs'
      - 'scripts/apple-color-regression.mjs'
      - '.github/workflows/visual-review.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/.vitepress/theme/**'
      - 'scripts/motion-regression.mjs'
      - 'scripts/all-pages-regression.mjs'
      - 'docs/**/*.md'
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install VitePress and Playwright
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build preview with Pages base path
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build
      - name: Screenshot and inspect site
        shell: bash
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
          PREVIEW_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          mkdir -p "/tmp/pleasejot-site-preview${SITE_BASE}"
          cp -a docs/.vitepress/dist/. "/tmp/pleasejot-site-preview${SITE_BASE}"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/pleasejot-site-preview > /tmp/pleasejot-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS -o /dev/null "${PREVIEW_URL}"; then break; fi
            sleep 1
          done
          failed=0
          for script in all-pages-regression apple-color-regression complex-motion-regression motion-regression visual-review layout-regression feedback-regression; do
            echo "::group::${script}"
            node "scripts/${script}.mjs" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pleasejot-visual-review
          path: pleasejot-visual-review/
          if-no-files-found: warn
